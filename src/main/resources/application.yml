spring:
  application:
    name: inventory-api

  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

jwt:
  secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-development-only}
  expiration-ms: 900000
